[project]
name = "asmexec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyelftools",
    "pwntools",
]

[project.scripts]
asmexec = "asmexec.asmexec:main"
