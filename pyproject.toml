[project]
name = "asmexec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyelftools",
    "pwntools",
    # pwntools depends on a version of unicorn without wheels for newest python versions
    # this removes the bad version
    "unicorn!=2.1.2",
    "ziglang==0.16.0"
]

[project.scripts]
asmexec = "asmexec.asmexec:main"
asmx = "asmexec.asmexec:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asmexec"]